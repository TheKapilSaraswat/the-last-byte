    <script>
      // Normalise "/admin/" to "/admin" so relative asset URLs still resolve
      // correctly when GitHub Pages serves the 404 fallback for the deep link.
      (function () {
        var path = window.location.pathname;
        if (/\/admin\/+$/.test(path)) {
          window.location.replace(
            path.replace(/\/+$/, '') + window.location.search + window.location.hash
          );
        }
      })();
    </script>
